[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senpaidub"
version = "0.1.0"
description = "Add an English TTS audio track to anime episodes, voiced from their English subtitles"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "keraliss" }]
keywords = ["anime", "dubbing", "tts", "text-to-speech", "subtitles", "ffmpeg", "voice-cloning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pysubs2>=1.7",
    "edge-tts>=6.1",
    "numpy>=1.24",
    "soundfile>=0.12",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "tomli-w>=1",
    "pyyaml>=6",
    "demucs>=4.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
google = ["google-cloud-texttospeech>=2.14"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/<you>/senpaidub"
Issues = "https://github.com/<you>/senpaidub/issues"

[project.scripts]
senpaidub = "senpaidub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/senpaidub"]
# Non-Python files inside the package (ui/*.html, ui/assets/*, ocr_vision.swift) ship automatically;
# listed here so a future .gitignore change can't silently drop them from the wheel.
artifacts = ["src/senpaidub/ui/**", "src/senpaidub/ocr_vision.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs ffmpeg end-to-end (needs ffmpeg on PATH)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# B008: typer.Option(...) in defaults is Typer's documented pattern.
# B905: zip() lengths are equal by construction here.
ignore = ["B008", "B905", "E741"]
